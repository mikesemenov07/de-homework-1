version: 2

models:
  - name: fct_orders
    description: >
      Факт заказов без тестовых заказов.
      Одна строка — один заказ с итогами платежей и числом разных товаров.
    columns:
      - name: order_id
        description: "Уникальный номер заказа."
        data_tests: [unique, not_null]

      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        description: "Дата оформления заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day

      - name: ordered_at
        description: "Дата и время оформления заказа."

      - name: order_status
        description: "Статус заказа; тестовые заказы исключены."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled']

      - name: order_amount
        description: "Сумма заказа после скидок, в рублях."
        data_tests: [not_null, non_negative]

      - name: paid_amount
        description: "Сумма успешных оплат без возвратов, в рублях."

      - name: refunded_amount
        description: "Сумма успешных возвратов положительным числом, в рублях."

      - name: net_paid_amount
        description: "Оплачено минус возвращено, в рублях."

      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."

      - name: first_paid_at
        description: "Время первой успешной оплаты; null, если оплат нет."

      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]

      - name: items_count
        description: "Количество разных товаров в заказе."
        data_tests: [not_null, non_negative]