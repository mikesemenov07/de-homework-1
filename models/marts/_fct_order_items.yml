version: 2

models:
  - name: fct_order_items
    description: >
      Факт позиций заказов без тестовых заказов.
      Одна строка — один товар в одном заказе.
    columns:
      - name: order_item_id
        description: "Составной ключ позиции: MD5 от номера заказа и товара."
        data_tests: [unique, not_null]

      - name: order_id
        description: "Номер заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

      - name: product_id
        description: "Номер товара."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: customer_id
        description: "Номер покупателя, оформившего заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        description: "Дата оформления заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day

      - name: quantity
        description: "Количество единиц товара в позиции."

      - name: unit_price
        description: "Цена одной единицы товара до скидки, в рублях."

      - name: discount_amount
        description: "Скидка на всю позицию, в рублях."

      - name: line_amount
        description: "Сумма позиции: quantity × unit_price − discount_amount."

      - name: order_status
        description: "Статус заказа; позволяет выделить возвращённые заказы."

      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]
        