name: dbt_shop

services:
  greenplum:
    image: "${GREENPLUM_IMAGE:-andruche/greenplum:7-4seg}"
    hostname: greenplum
    ports:
      - "${GP_PORT:-5440}:5432"
    shm_size: "1gb"
    healthcheck:
      test:
        - CMD-SHELL
        - /usr/local/gpdb/bin/pg_isready -h localhost -p 5432 -U gpadmin -d postgres
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: student
      POSTGRES_PASSWORD: studentpass
    ports:
      - "${PG_PORT:-5436}:5432"
    volumes:
      - dbt_shop_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20
  
  loader:
    build: .
    image: dbt-shop:1.10
    entrypoint: ["python", "-u", "/project/loader/load.py"]
    depends_on:
      postgres:
        condition: service_healthy
      greenplum:
        condition: service_healthy
    volumes:
      - .:/project


  dbt:
    build: .
    image: dbt-shop:1.10
    profiles: ["tools"]
    depends_on:
      greenplum:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
    environment:
      DBT_HOST: greenplum
      DBT_PORT: "5432"
      DBT_PROFILES_DIR: /project
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      DBT_VERSION_CHECK: "false"
    volumes:
      - .:/project
    ports:
      - "${DOCS_PORT:-8080}:8080"

volumes:
  dbt_shop_pgdata:
